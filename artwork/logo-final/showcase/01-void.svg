    <g id="mark" color="#F8FCFB">
      <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M25 27v46M75 27v46M25 50h18M57 50h18" opacity=".58"/>
        <path d="M28 28 47 47M72 28 53 47M28 72l19-19M72 72 53 53"/>
      </g>
      <g fill="currentColor"><circle cx="25" cy="27" r="7"/><circle cx="25" cy="73" r="7"/><circle cx="75" cy="27" r="7"/><circle cx="75" cy="73" r="7"/><rect x="43" y="43" width="14" height="14" rx="4.5"/></g>
    </g>
