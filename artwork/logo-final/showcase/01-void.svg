  <rect width="1600" height="900" fill="#000"/>
  <rect width="980" height="720" fill="url(#corner)" opacity=".7"/>
  <rect width="1600" height="900" filter="url(#noise)" opacity=".6"/>
  <circle cx="800" cy="445" r="260" fill="#53D7F4" opacity=".025"/>
  <g transform="translate(550 195) scale(5)"><use href="#mark"/></g>
