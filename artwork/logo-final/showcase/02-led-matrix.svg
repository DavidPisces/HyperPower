<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HyperPower — LED Matrix</title>
  <desc id="desc">The Core Topology logo above a digital hardware matrix.</desc>
  <defs>
    <pattern id="matrix" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#53D7F4" opacity=".2"/>
    </pattern>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#041114"/>
      <stop offset=".52" stop-color="#071012"/>
      <stop offset="1" stop-color="#0C1707"/>
    </linearGradient>
    <radialGradient id="wave" cx="50%" cy="50%" r="50%">
      <stop stop-color="#53D7F4" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#B8F25A" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071012" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#field)"/>
  <ellipse cx="800" cy="470" rx="670" ry="310" fill="url(#wave)"/>
  <path d="M0 640C260 510 430 690 690 565S1110 470 1600 610V900H0Z" fill="url(#matrix)" opacity=".9"/>
  <path d="M0 720C290 580 480 770 760 625S1210 560 1600 690" fill="none" stroke="#B8F25A" stroke-width="2" opacity=".25"/>
  <g transform="translate(550 195) scale(5)" color="#F8FCFB">
    <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M25 27v46M75 27v46M25 50h18M57 50h18" opacity=".58"/><path d="M28 28 47 47M72 28 53 47M28 72l19-19M72 72 53 53"/></g>
    <g fill="currentColor"><circle cx="25" cy="27" r="7"/><circle cx="25" cy="73" r="7"/><circle cx="75" cy="27" r="7"/><circle cx="75" cy="73" r="7"/><rect x="43" y="43" width="14" height="14" rx="4.5"/></g>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3">
    <text x="64" y="72" fill="#53D7F4">HYPERPOWER / HARDWARE SIGNAL</text>
    <text x="1536" y="72" text-anchor="end" fill="#6D817D">CPU · POWER · MEMORY</text>
    <text x="64" y="844" fill="#6D817D">SAMPLE RATE / 1000 MS</text>
    <text x="1536" y="844" text-anchor="end" fill="#6D817D">LIVE SYSTEM VIEW</text>
  </g>
