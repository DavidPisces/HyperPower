<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Core Aperture</title>
  <desc id="desc">A solid monitoring core reveals an H through rounded negative space.</desc>
  <defs>
    <mask id="aperture">
      <rect width="100" height="100" fill="black"/>
      <circle cx="50" cy="50" r="34" fill="white"/>
      <rect x="30" y="31" width="11" height="38" rx="5.5" fill="black"/>
      <rect x="59" y="31" width="11" height="38" rx="5.5" fill="black"/>
      <rect x="37" y="44.5" width="26" height="11" rx="5.5" fill="black"/>
      <circle cx="72" cy="27" r="5" fill="black"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="34" fill="currentColor" mask="url(#aperture)"/>
</svg>
