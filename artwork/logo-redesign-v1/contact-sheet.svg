    <g transform="translate(562 230)">
      <rect width="476" height="404" rx="28" fill="#101B1E" stroke="#2A3A3E"/>
      <rect x="20" y="20" width="436" height="244" rx="22" fill="#F1F6F2"/>
      <g transform="translate(138 42) scale(2)" color="#071012"><use href="#mark-2"/></g>
