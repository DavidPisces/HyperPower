      <g fill="currentColor"><circle cx="25" cy="27" r="7"/><circle cx="25" cy="73" r="7"/><circle cx="75" cy="27" r="7"/><circle cx="75" cy="73" r="7"/><rect x="41" y="41" width="18" height="18" rx="6"/></g>
