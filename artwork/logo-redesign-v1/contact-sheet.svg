      <rect width="476" height="404" rx="28" fill="#101B1E" stroke="#2A3A3E"/>
      <rect x="20" y="20" width="436" height="244" rx="22" fill="#071012"/>
      <circle cx="238" cy="142" r="96" fill="#B8F25A" opacity=".04"/>
      <g transform="translate(138 42) scale(2)" color="#B8F25A" filter="url(#glow)"><use href="#mark-5"/></g>
      <g transform="translate(403 214) scale(.34)" color="#F0F6F4"><use href="#mark-5"/></g>
      <text x="28" y="307" fill="#53D7F4" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">05 / IMMEDIATE</text>
      <text x="28" y="350" fill="#F0F6F4" font-family="Inter, sans-serif" font-size="30" font-weight="600">Torque Ring</text>
      <text x="28" y="378" fill="#9DADAA" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1">GEOMETRY + LINES · KINETIC</text>
