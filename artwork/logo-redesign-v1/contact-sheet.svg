<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">HyperPower logo redesign, round one</title>
  <desc id="desc">Six logo directions presented on a dark technical brand board.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#53D7F4"/>
      <stop offset="1" stop-color="#B8F25A"/>
    </linearGradient>
    <radialGradient id="ambient" cx="18%" cy="0%" r="95%">
      <stop stop-color="#173A3E"/>
      <stop offset=".56" stop-color="#071012"/>
      <stop offset="1" stop-color="#030708"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComponentTransfer in="blur" result="soft-glow"><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="mark-1" fill="currentColor">
      <rect x="20" y="18" width="16" height="64" rx="8"/>
      <rect x="64" y="18" width="16" height="64" rx="8"/>
      <path d="M31 47h10.5l7.2-10.8a6 6 0 0 1 10.5 1.1L65.5 53H70v14H61a7 7 0 0 1-6.5-4.4l-2.9-7.3-2.3 3.5A7 7 0 0 1 43.5 62H31Z"/>
    </g>
    <g id="mark-2" fill="currentColor">
      <rect x="20" y="18" width="13" height="13" rx="4"/><rect x="20" y="35" width="13" height="13" rx="4"/><rect x="20" y="52" width="13" height="13" rx="4"/><rect x="20" y="69" width="13" height="13" rx="4"/>
      <rect x="67" y="18" width="13" height="13" rx="4"/><rect x="67" y="35" width="13" height="13" rx="4"/><rect x="67" y="52" width="13" height="13" rx="4"/><rect x="67" y="69" width="13" height="13" rx="4"/>
      <rect x="37" y="43.5" width="26" height="13" rx="4"/>
