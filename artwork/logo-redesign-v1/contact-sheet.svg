      <rect x="20" y="20" width="436" height="244" rx="22" fill="#F1F6F2"/>
      <g transform="translate(138 42) scale(2)" color="#071012"><use href="#mark-4"/></g>
      <g transform="translate(403 214) scale(.34)" color="#071012"><use href="#mark-4"/></g>
      <text x="28" y="307" fill="#53D7F4" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">04 / PREMIUM</text>
      <text x="28" y="350" fill="#F0F6F4" font-family="Inter, sans-serif" font-size="30" font-weight="600">Core Aperture</text>
      <text x="28" y="378" fill="#9DADAA" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1">NEGATIVE SPACE · DENSE</text>
