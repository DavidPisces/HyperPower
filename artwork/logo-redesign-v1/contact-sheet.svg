  <text x="1542" y="1124" text-anchor="end" fill="#60716E" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">CURRENTCOLOR READY · 16 PX TESTED · ANDROID ADAPTIVE READY</text>
