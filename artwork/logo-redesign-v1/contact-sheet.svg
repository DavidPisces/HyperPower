    <mask id="aperture-board">
      <rect width="100" height="100" fill="black"/>
      <circle cx="50" cy="50" r="34" fill="white"/>
      <rect x="30" y="31" width="11" height="38" rx="5.5" fill="black"/>
      <rect x="59" y="31" width="11" height="38" rx="5.5" fill="black"/>
      <rect x="37" y="44.5" width="26" height="11" rx="5.5" fill="black"/>
      <circle cx="72" cy="27" r="5" fill="black"/>
    </mask>
    <circle id="mark-4" cx="50" cy="50" r="34" fill="currentColor" mask="url(#aperture-board)"/>
    <g id="mark-5">
