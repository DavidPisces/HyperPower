<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">H Array</title>
  <desc id="desc">A modular capsule matrix forms an H with one accelerated cell.</desc>
  <defs>
    <rect id="cell" width="13" height="13" rx="4" fill="currentColor"/>
  </defs>
  <g>
    <use href="#cell" x="20" y="18"/>
    <use href="#cell" x="20" y="35"/>
    <use href="#cell" x="20" y="52"/>
    <use href="#cell" x="20" y="69"/>
    <use href="#cell" x="67" y="18"/>
    <use href="#cell" x="67" y="35"/>
    <use href="#cell" x="67" y="52"/>
    <use href="#cell" x="67" y="69"/>
    <rect x="37" y="43.5" width="26" height="13" rx="4" fill="currentColor"/>
    <rect x="70" y="12" width="20" height="9" rx="4.5" fill="currentColor" opacity=".52" transform="rotate(-28 80 16.5)"/>
  </g>
</svg>
